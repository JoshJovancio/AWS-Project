server {
    listen 80;

    location /equipment {
        proxy_pass http://equipment-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://equipment-api:3000/health;
    }

    location / {
        return 200 'University Equipment Management System - Web UI Coming Soon';
        add_header Content-Type text/plain;
    }
}