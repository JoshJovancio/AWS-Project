server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /equipment {
        proxy_pass http://equipment-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://equipment-api:3000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}