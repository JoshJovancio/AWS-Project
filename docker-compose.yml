services:
  equipment-api:
    image: ${ECR_REGISTRY}/equipment-api:latest
    build: ./api
    expose:
      - "3000"
    env_file:
      - ./api/.env
    networks:
      - app-network
    restart: unless-stopped

  web-ui:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - equipment-api
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge